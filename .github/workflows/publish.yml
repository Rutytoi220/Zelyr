name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-and-build-dist:
    name: Validate Tag & Build Python Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches commit and pyproject.toml version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py --tag-env RELEASE_TAG --check-checkout --check-version

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distributions
        run: python scripts/build_dist.py

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  appimage:
    name: Test & Build Linux AppImage
    needs: validate-and-build-dist
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  cross-platform:
    name: Build Cross-Platform Installers
    needs: validate-and-build-dist
    uses: ./.github/workflows/build-all.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  pypi-publish:
    name: Build and Publish to PyPI
    needs: [validate-and-build-dist, appimage, cross-platform]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zelyr-core
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: read
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_name }}
          sparse-checkout: scripts

      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Verify exact Python distribution filenames
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_release_assets.py --tag-env RELEASE_TAG --assets-dir dist --mode pypi
          ls -la dist/

      - name: Publish package distributions to PyPI
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: PyPI Publication Failure Diagnostics
        if: failure() && steps.pypi-publish.outcome == 'failure'
        run: |
          echo "::error title=PyPI Publication Failed::PyPI publication failed; GitHub Release publication has been blocked to prevent a misleading release state."
          echo "Inspect the 'Publish package distributions to PyPI' logs above for the exact failure cause (e.g., invalid-publisher, duplicate filename/version, metadata rejection, or network failure)."
          echo "If registering PyPI Trusted Publishing for the first time at https://pypi.org/manage/account/publishing/:"
          echo "  Owner: ${{ github.repository_owner }}, Repository: ${{ github.event.repository.name }}, Workflow: publish.yml, Environment: pypi"
          echo "If a partial upload occurred (e.g., .tar.gz uploaded before .whl failed), inspect https://pypi.org/p/zelyr-core before retrying because PyPI rejects re-uploading existing filenames."

  github-release:
    name: Create and Publish GitHub Release
    needs: [validate-and-build-dist, appimage, cross-platform, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Sole workflow job authorized to create/publish the release on tag push
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_name }}
          sparse-checkout: scripts

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify exact versioned release assets are present
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ls -la release-assets/
          python3 scripts/check_release_assets.py --tag-env RELEASE_TAG --assets-dir release-assets --mode release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.dmg
            release-assets/*.zip
