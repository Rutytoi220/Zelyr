name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zelyr-core
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: write  # IMPORTANT: mandatory for creating GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distributions
        run: |
          python scripts/build_dist.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish package distributions to PyPI
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

      - name: PyPI Trusted Publishing Diagnostic Notice
        if: steps.pypi-publish.outcome == 'failure'
        run: |
          echo "::warning title=PyPI Trusted Publishing Inactive::PyPI publication failed because the repository has not yet been registered as a Trusted Publisher on PyPI (https://pypi.org/manage/account/publishing/). GitHub Release creation succeeded and distribution assets (.whl, .tar.gz) are attached."
          echo "To enable automated PyPI uploads:"
          echo "  1. Log into https://pypi.org"
          echo "  2. Go to Publishing -> Add a new publisher (GitHub Actions)"
          echo "  3. Set Owner: ${{ github.repository_owner }}, Repository: ${{ github.event.repository.name }}, Workflow: publish.yml, Environment: pypi"
