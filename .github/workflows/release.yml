name: Release AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Headless Test Suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI and Headless Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Set up uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv --python 3.11 --clear
          uv pip install pytest pytest-asyncio pytest-qt
          uv sync --python 3.11

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/ -v

  build-and-release:
    name: Build & Release AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI and Headless Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse \
            libfuse2 \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Set up uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build AppImage
        run: |
          bash scripts/build_appimage.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Zelyr-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
