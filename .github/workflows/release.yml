name: Build Linux AppImage

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the AppImage for (e.g. v1.4.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Headless Test Suite
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify checked-out commit matches requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release_tag.py --tag-env RELEASE_TAG --check-checkout --check-version

      - name: Install Linux GUI and Headless Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.11 --clear
          uv pip install pytest pytest-asyncio pytest-qt
          uv sync --python 3.11

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/ -v

  build-appimage:
    name: Build AppImage
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify checked-out commit matches requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release_tag.py --tag-env RELEASE_TAG --check-checkout --check-version

      - name: Install Linux GUI and Headless Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse \
            libfuse2 \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build AppImage
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/build_appimage.sh "$RELEASE_TAG"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux
          path: Zelyr-v*-x86_64.AppImage
          if-no-files-found: error
