name: Feature Request
description: Suggest a new capability for Zelyr v5.3.0+
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Kernel Evolution
        - New Agent Skill
        - Security / Sandbox
        - UI / UX Enhancement
        - P2P / Swarm Optimization
        - Hardware Integration
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to achieve.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Describe a specific scenario where this feature would be useful.
    validations:
      required: true
  - type: textarea
    id: implementation_ideas
    attributes:
      label: Implementation Ideas
      description: Any thoughts on how to build this within the current v5.3.0 architecture?
