name: Bug Report
description: Create a report to help us improve Zelyr v5.3.0
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Zelyr Version
      description: What version of Zelyr are you running? (e.g., v5.3.0 or commit hash)
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of Zelyr is affected?
      options:
        - Kernel / Self-Patcher
        - ZelyrFS (FUSE)
        - Multimodal HUD (GUI)
        - Security / Sandbox (bwrap/QEMU)
        - Swarm / Networking
        - MCP Server
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: Are you using Linux (which distro?), macOS, or Windows?
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware Info
      description: CPU, RAM, and GPU (especially for Whisper/Piper performance issues).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant terminal output or crash logs here.
      render: shell
