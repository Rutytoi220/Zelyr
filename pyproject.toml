[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zelyr-core"
version = "1.0.0"
authors = [
  { name="Zelyr Contributors", email="admin@zelyr.local" },
]
description = "A Local-First AI Operating System for Linux."
readme = "README.md"
requires-python = ">=3.10, <3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "markdown>=3.4.0",
    "qasync>=0.27.1",
    "anthropic>=0.16.0",
    "PySide6>=6.0",
    "litellm>=1.93.0",
    "websockets>=14.0",
    "Pillow>=9.0.0",
    "pydantic>=2.0",
    "chromadb>=0.4.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "psutil>=5.6.6",
    "watchdog>=3.0.0",
    "structlog>=24.0.0",
    "opencv-python-headless>=4.8.0",
    "rich>=13.0.0",
    "torch>=2.14.1",
    "transformers>=4.48.0",
    "bitsandbytes>=0.50.2",
    "accelerate>=1.15.0",
    "torchvision>=0.29.1",
    "playwright>=1.63.0",
    "httpx>=0.24.0",
    "prompt_toolkit>=3.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "croniter>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
    "piper-tts>=1.2.0",
    "openwakeword>=0.4.0",
    "sounddevice>=0.4.0"
]
automation = [
    "pyautogui>=0.9.54",
    "nxbt>=0.1.4"
]
experimental = [
    "networkx>=3.0",
    "wasmtime>=12.0.0",
    "textual>=0.30.0",
    "prompt_toolkit>=3.0.0",
    "fusepy>=3.0.1"
]

[project.scripts]
zelyr = "zelyr.cli.main:main"
zelyrd = "zelyr.server.daemon:main"
zelyr-gui = "zelyr.gui.app:main"
# Legacy command aliases kept for existing installations and scripts.
axiom = "zelyr.cli.main:main"
axiomd = "zelyr.server.daemon:main"
axiom-gui = "zelyr.gui.app:main"

[tool.setuptools.packages.find]
include = ["zelyr*", "axiom*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.qss", "*.json", "*.tcss", "*.png", "*.svg", "*.ttf", "*.js", "*.template", "*.txt", "*.desktop", "*.service", "*.sh"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-qt>=4.5.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.6.0",
    "build>=1.0",
    "twine>=4.0",
    "pyinstaller>=6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "tests/unit", "tests/gui", "tests/e2e", "tests/integration", "tests/optional", "tests/simulation", "zelyr/tests", "dist", "build", "node_modules", ".venv"]
addopts = "--ignore=tests/fixtures --ignore=tests/unit --ignore=tests/gui --ignore=tests/e2e --ignore=tests/integration --ignore=tests/optional --ignore=tests/simulation --ignore=zelyr/tests -m 'not e2e and not requires_wayland and not hardware'"
markers = [
    "unit: purely isolated unit tests",
    "integration: tests combining multiple systems",
    "e2e: full end-to-end user flows",
    "gui: marks tests testing Qt components",
    "requires_bwrap: tests needing bubblewrap capability",
    "requires_ollama: tests hitting local ollama inferencing",
    "requires_wayland: tests requiring a live Wayland compositor",
    "hardware: Tests requiring physical audio or peripheral devices",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
    "tests/fixtures",
    "tests/unit",
    "tests/gui",
    "tests/e2e",
    "tests/integration",
    "tests/optional",
    "tests/simulation",
    "zelyr/tests",
]

[tool.ruff.lint]
select = [
    "E9",      # Syntax and structural runtime errors
    "F",       # Pyflakes (undefined variables, invalid logic, syntax checks)
]
ignore = [
    "F401",    # Unused imports (public package re-exports)
    "F841",    # Unused local variables
    "F541",    # F-string without placeholders
    "F811",    # Redefined function or variable
]
